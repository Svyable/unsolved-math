name: Sync UnsolvedMath

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      revision:
        description: Hugging Face revision to resolve
        required: false
        default: main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: unsolvedmath-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      SYNC_BRANCH: automation/unsolvedmath-sync
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install uv
        run: python -m pip install uv
      - name: Install locked environment
        run: uv sync --locked --all-extras
      - name: Resolve revision
        id: revision
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
        run: echo "value=${REQUESTED_REVISION:-main}" >> "$GITHUB_OUTPUT"
      - name: Synchronize and rank
        run: >-
          uv run oplab sync
          --revision "${{ steps.revision.outputs.value }}"
          --allow-network
          --limit 200
      - name: Validate generated artifacts
        run: uv run oplab validate
      - name: Prepare review branch
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$SYNC_BRANCH"
          git add data
          git commit -m "chore(data): sync UnsolvedMath snapshot"
          git push --force-with-lease origin "HEAD:$SYNC_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Open or refresh review pull request
        if: steps.changes.outputs.changed == 'true'
        run: |
          number="$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            gh pr create \
              --base main \
              --head "$SYNC_BRANCH" \
              --title "chore(data): review UnsolvedMath sync" \
              --body-file data/current/sync-summary.md
          else
            gh pr edit "$number" \
              --title "chore(data): review UnsolvedMath sync" \
              --body-file data/current/sync-summary.md
          fi
